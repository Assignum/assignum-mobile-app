<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reparte las tareas de tu grupo según lo que cada uno sabe hacer.">
  <meta name="theme-color" content="#2A2723">

  <!-- iPhone: "Añadir a pantalla de inicio" la abre como app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Assignum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Assignum</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F4F2EA; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6E6B61; font-size: 15px;
    }
    #carga img { width: 88px; height: 88px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    Cargando Assignum…
  </div>
  <script>
    // Quita la pantalla de carga cuando Flutter dibuja su primer cuadro.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
